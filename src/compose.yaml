name: CineLock
services:
    pgsql:
        image: postgres:18.6-alpine
        env_file: ".env"
        ports: 
            - "${DB_PORT}:5432"
        environment:
            - POSTGRES_DB=${DB_NAME}
            - POSTGRES_PASSWORD=${DB_PASSWORD}
            - POSTGRES_USER=${DB_USER}
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s
        deploy:
            resources: 
                limits:
                    memory: 512M
        stop_grace_period: 30s
        security_opt:
            - no-new-privileges:true
        volumes:
            - db_data:/var/lib/postgresql
        networks:
            - cinelock_network
networks:
    cinelock_network:
        driver: bridge

volumes:
    db_data:
    